<svg xmlns="http://www.w3.org/2000/svg" width="280" height="150" viewBox="0 0 280 150">
  <rect x="0" y="0" width="280" height="150" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- an IC and its pins, seen from above -->
    <rect x="24" y="28" width="80" height="84" rx="3" stroke="{fg}" stroke-width="1.6" fill="{grid}"/>
    <text x="64" y="74" fill="{fg}" text-anchor="middle">IC</text>
    <rect x="104" y="38" width="10" height="6" fill="{muted}"/>
    <rect x="104" y="57" width="10" height="6" fill="{fg}"/>
    <rect x="104" y="76" width="10" height="6" fill="{muted}"/>
    <rect x="104" y="95" width="10" height="6" fill="{muted}"/>
    <!-- a cap with a pad near a pin on its net: decoupling -->
    <rect x="148" y="54" width="26" height="12" rx="2" stroke="{dec}" stroke-width="1.4" fill="{bg}"/>
    <rect x="148" y="54" width="7" height="12" fill="{dec}"/>
    <rect x="167" y="54" width="7" height="12" fill="{dec}"/>
    <text x="161" y="84" fill="{dec}" text-anchor="middle" font-size="10">decoupling:</text>
    <text x="161" y="97" fill="{dec}" text-anchor="middle" font-size="10">not a stitching cap</text>
    <!-- how near -->
    <path d="M114,44 V36 M148,44 V36 M116,40 H146 M120,37 L116,40 L120,43 M142,37 L146,40 L142,43" stroke="{dist}" stroke-width="1.2" fill="none"/>
    <text x="131" y="26" fill="{dist}" text-anchor="middle" font-size="10">distance</text>
    <!-- a cap further away: a stitching cap -->
    <rect x="222" y="108" width="26" height="12" rx="2" stroke="{muted}" stroke-width="1.4" fill="{bg}"/>
    <rect x="222" y="108" width="7" height="12" fill="{muted}"/>
    <rect x="241" y="108" width="7" height="12" fill="{muted}"/>
    <text x="235" y="138" fill="{muted}" text-anchor="middle" font-size="10">stitching cap</text>
  </g>
</svg>
