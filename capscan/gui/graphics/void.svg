<svg xmlns="http://www.w3.org/2000/svg" width="280" height="156" viewBox="0 0 280 156">
  <rect x="0" y="0" width="280" height="156" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- a plane, seen from above, with holes under the trace -->
    <rect x="14" y="14" width="252" height="110" rx="3" fill="{grid}"/>
    <circle cx="60" cy="62" r="7" fill="{bg}" stroke="{small}" stroke-width="1.4"/>
    <rect x="120" y="36" width="64" height="54" rx="4" fill="{bg}" stroke="{void}" stroke-width="1.4" stroke-dasharray="5 3"/>
    <!-- the trace, and its return current going round the void -->
    <path d="M22,62 H258" stroke="{fg}" stroke-width="2" fill="none"/>
    <path d="M22,70 H114 V98 H190 V70 H258" stroke="{ret}" stroke-width="1.4" stroke-dasharray="4 3" fill="none"/>
    <text x="22" y="116" fill="{ret}" font-size="10">return current</text>
    <text x="60" y="32" fill="{small}" text-anchor="middle" font-size="10">short hole:</text>
    <text x="60" y="45" fill="{small}" text-anchor="middle" font-size="10">ignored</text>
    <text x="152" y="142" fill="{void}" text-anchor="middle">void: reroute or fill it</text>
  </g>
</svg>
