<svg xmlns="http://www.w3.org/2000/svg" width="280" height="182" viewBox="0 0 280 182">
  <rect x="0" y="0" width="280" height="182" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <!-- a cross-section: two reference planes, each with the via's antipad -->
    <path d="M14,50 H132 M148,50 H266" stroke="{muted}" stroke-width="7" fill="none"/>
    <path d="M14,110 H132 M148,110 H266" stroke="{muted}" stroke-width="7" fill="none"/>
    <text x="266" y="40" fill="{muted}" text-anchor="end" font-size="10">plane</text>
    <text x="266" y="128" fill="{muted}" text-anchor="end" font-size="10">plane</text>
    <!-- the signal: on top, down the via, on the bottom -->
    <path d="M20,26 H140 V136 H260" stroke="{fg}" stroke-width="2.2" fill="none"/>
    <rect x="135" y="22" width="10" height="118" fill="none" stroke="{fg}" stroke-width="1"/>
    <text x="20" y="18" fill="{fg}" font-size="10">signal</text>
    <!-- a return via, where both planes are the same net -->
    <path d="M78,50 V110" stroke="{rvia}" stroke-width="5" fill="none"/>
    <text x="78" y="156" fill="{rvia}" text-anchor="middle" font-size="10">return via</text>
    <text x="78" y="170" fill="{rvia}" text-anchor="middle" font-size="10">(same net)</text>
    <!-- a stitching cap, where they are different nets -->
    <path d="M206,54 V74 M194,74 H218 M194,84 H218 M206,84 V106" stroke="{cap}" stroke-width="2" fill="none"/>
    <text x="206" y="156" fill="{cap}" text-anchor="middle" font-size="10">stitching cap</text>
    <text x="206" y="170" fill="{cap}" text-anchor="middle" font-size="10">(other net)</text>
    <!-- how far each is from the via -->
    <path d="M82,80 H131 M86,77 L82,80 L86,83 M127,77 L131,80 L127,83" stroke="{dvia}" stroke-width="1.2" fill="none"/>
    <text x="106" y="96" fill="{dvia}" text-anchor="middle" font-size="10">distance</text>
    <path d="M149,80 H190 M153,77 L149,80 L153,83 M186,77 L190,80 L186,83" stroke="{dcap}" stroke-width="1.2" fill="none"/>
    <text x="170" y="96" fill="{dcap}" text-anchor="middle" font-size="10">distance</text>
  </g>
</svg>
