<svg xmlns="http://www.w3.org/2000/svg" width="280" height="164" viewBox="0 0 280 164">
  <rect x="0" y="0" width="280" height="164" rx="8" fill="{bg}"/>
  <g font-family="sans-serif" font-size="11">
    <path d="M30,16 V124 H266" stroke="{muted}" stroke-width="1.2" fill="none"/>
    <text x="22" y="26" fill="{muted}" text-anchor="middle">V</text>
    <text x="262" y="138" fill="{muted}">t</text>
    <!-- the 10 % and 90 % levels -->
    <path d="M30,111 H262 M30,39 H262" stroke="{muted}" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
    <text x="262" y="107" fill="{muted}" text-anchor="end" font-size="10">10 %</text>
    <text x="262" y="52" fill="{muted}" text-anchor="end" font-size="10">90 %</text>
    <!-- the edge, and the same edge slowed by the cap's inductance -->
    <path d="M30,120 H90 L156,30 H262" stroke="{slow}" stroke-width="1.8" stroke-dasharray="5 3" fill="none"/>
    <path d="M30,120 H90 L130,30 H262" stroke="{tr}" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
    <text x="158" y="78" fill="{slow}" font-size="10">slowed by the cap:</text>
    <text x="158" y="92" fill="{slow}" font-size="10">+ 1.1 L / Z0</text>
    <!-- the edge rate, 10 % to 90 % -->
    <path d="M94,111 V146 M126,39 V146" stroke="{muted}" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
    <path d="M94,142 H126 M98,139 L94,142 L98,145 M122,139 L126,142 L122,145" stroke="{tr}" stroke-width="1.2" fill="none"/>
    <text x="110" y="158" fill="{tr}" text-anchor="middle" font-size="10">edge rate</text>
  </g>
</svg>
