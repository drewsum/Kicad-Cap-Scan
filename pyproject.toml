[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capscan"
dynamic = ["version"]
description = "Stitching-capacitor advisor for KiCad: finds signals crossing plane splits and says where to put stitching caps"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Drew Maatman", email = "drewmaatman@gmail.com" }]
keywords = ["kicad", "pcb", "signal integrity", "return path", "stitching capacitor", "split plane"]
# What KiCad installs into the plugin's venv: requirements.txt, kept in step by
# tests/test_requirements.py.
dependencies = [
    "kicad-python>=0.7.1",
    "PySide6-Essentials>=6.6",
    "qtpy>=2.4",
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    "numpy>=1.24",
    "shapely>=2.1",
    "plotly>=5.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff==0.17.0"]  # keep in sync with requirements-dev.txt

[project.urls]
Homepage = "https://github.com/drewsum/Kicad-Cap-Scan"
Issues = "https://github.com/drewsum/Kicad-Cap-Scan/issues"

[tool.setuptools.dynamic]
version = { attr = "capscan.__version__" }

[tool.setuptools.packages.find]
include = ["capscan*"]

[tool.setuptools.package-data]
"capscan.gui" = ["graphics/*.svg", "graphics/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 110
extend-exclude = ["build", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "B"]
ignore = [
    "E731",   # small lambdas assigned to names read fine
    "E741",   # `l` is used throughout for layer
    "B905",   # zip() strict=: lengths are matched by construction
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/helpers"]
addopts = "-ra"
timeout = 300
