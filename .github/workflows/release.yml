name: Release zip

# Attaches CapScan-<tag>.zip to each published release: a CapScan/ folder ready to drop
# into KiCad's plugins folder, without the tests and CI.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the zip to"
        required: true

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build zip
        run: git archive --format=zip --prefix=CapScan/ -o "CapScan-$TAG.zip" HEAD -- . ':!tests' ':!.github'
      - name: Upload to the release
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "CapScan-$TAG.zip"; then
            echo "::notice::CapScan-$TAG.zip is already attached to $TAG"
          else
            gh release upload "$TAG" "CapScan-$TAG.zip"
          fi
