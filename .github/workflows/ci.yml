name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install "$(grep '^ruff' requirements-dev.txt)"
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.kipy && format(', kicad-python {0}', matrix.kipy) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The Python each platform's KiCad runs plugins with (as for KiPI): Windows' own
        # 3.11, Linux system Pythons 3.10 to 3.13, and a user-chosen one on macOS.
        include:
          - { os: windows-latest, python: "3.11" }
          - { os: ubuntu-latest,  python: "3.10" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: ubuntu-latest,  python: "3.13" }
          - { os: macos-latest,   python: "3.12" }
          # The oldest kicad-python requirements.txt allows.
          - { os: ubuntu-latest,  python: "3.11", kipy: "0.7.1" }
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries for VTK / Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxrender1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Pin kicad-python
        if: matrix.kipy
        run: pip install "kicad-python==${{ matrix.kipy }}"
      - name: Validate plugin manifest
        run: python -m kipy.packaging validate .
      - name: Import GUI modules
        run: python -c "import capscan.gui.main_window, capscan.gui.viewer3d, capscan_entry"
      - name: Run tests
        run: python -m pytest -v

  # Each KiCad release CapScan supports, as its own step, against the fake KiCad
  # (tests/helpers/kicad_fake.py), which refuses what that release did not have yet.
  kicad:
    name: KiCad versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: KiCad 9.0.0 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.0"
      - name: KiCad 9.0.1 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.1"
      - name: KiCad 9.0.3 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.3"
      - name: KiCad 9.0.5 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.5"
      - name: KiCad 9.0.7 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.7"
      - name: KiCad 9.0.8 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "9.0.8"
      - name: KiCad 10.0.0 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "10.0.0"
      - name: KiCad 10.0.1 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "10.0.1"
      - name: KiCad 10.0.6 (IPC API)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -q tests/kicad -k "10.0.6"
